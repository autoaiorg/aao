name: Core checks
on:
  push:
  pull_request:
# Public repository: the workflow token is read-only (exposure audit EXP-05).
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aao_test
          POSTGRES_DB: aao_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aao_test -d aao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor; the
          # bwrap sandbox (repository checks, agent candidates) needs them on the disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Apply PostgreSQL schema to the disposable CI database
        env:
          AAO_TEST_POSTGRES_URL: postgresql://aao_test@localhost:5432/aao_test
        run: |
          for migration in db/postgres/001_foundation.sql \
            db/postgres/002_dev_identity.sql \
            db/postgres/003_execution.sql \
            db/postgres/004_execution_guards.sql \
            db/postgres/005_principal_credentials.sql; do
            psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO worker_registrations(worker_id,token_digest,enabled) VALUES ('legacy-ci-agent','f96fec142530f614fd37bdadb76c54cd017b1ccabb0d29164ef894447f36a81f',true)"
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/006_unified_execution_identity.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/007_fence_leases_across_project_state_changes.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/008_content_addressed_evidence.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/009_prevent_evidence_truncation.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/010_capability_registry.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/011_sha_bound_reviews_and_veto.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/012_patch_proposals.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/013_work_description.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/014_execution_retry.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/015_organization_profiles.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/016_project_conversations.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/017_ceo_browser_sessions.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/018_conversation_provider_metadata.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/019_project_conversation_turns.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/020_persistent_work_groups.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/021_conversation_turn_leases.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/022_work_item_assignments.sql
          psql "$AAO_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f db/postgres/023_work_group_consolidations.sql
      - run: python -m compileall -q src tests
      - run: python -m ruff check src tests
      - name: Run unit and PostgreSQL integration tests with warnings as errors
        env:
          AAO_ENV: test
          AAO_TEST_POSTGRES_URL: postgresql://aao_test@localhost:5432/aao_test
          AAO_TEST_DB_DISPOSABLE: "yes"
        # --tb=short: tracebacks omit function arguments/locals, reducing the chance that test
        # credentials reach public logs (exposure audit EXP-02). Explicit test output can still leak.
        run: python -m pytest -q -rs -W error --tb=short
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
