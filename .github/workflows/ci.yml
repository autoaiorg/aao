name: Core checks
on:
  push:
  pull_request:
# Public repository: the workflow token is read-only (exposure audit EXP-05).
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aao_test
          POSTGRES_DB: aao_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aao_test -d aao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor; the
          # bwrap sandbox (repository checks, agent candidates) needs them on the disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Apply PostgreSQL schema to the disposable CI database via unified migrator
        env:
          AAO_TEST_POSTGRES_URL: postgresql://aao_test@localhost:5432/aao_test
          AAO_TEST_RESTORE_AUTHORITY_URL: postgresql://aao_test@localhost:5432/aao_restore_authority
        run: |
          python scripts/migrate.py --apply --dsn "$AAO_TEST_POSTGRES_URL"
          python scripts/migrate.py --verify --dsn "$AAO_TEST_POSTGRES_URL"
          # Anti-replay tests require a distinct, disposable database: the authority
          # ledger must not share the database that a destructive restore can replace.
          createdb --host=localhost --username=aao_test aao_restore_authority
          psql "$AAO_TEST_RESTORE_AUTHORITY_URL" --set ON_ERROR_STOP=1 \
            --file db/postgres/restore_authority/001_consumed_restore_authorizations.sql
      - run: python -m compileall -q src tests
      - run: python -m ruff check src tests
      - name: Run unit and PostgreSQL integration tests with warnings as errors
        env:
          AAO_ENV: test
          AAO_TEST_POSTGRES_URL: postgresql://aao_test@localhost:5432/aao_test
          AAO_TEST_RESTORE_AUTHORITY_URL: postgresql://aao_test@localhost:5432/aao_restore_authority
          AAO_TEST_DB_DISPOSABLE: "yes"
        # --tb=short: tracebacks omit function arguments/locals, reducing the chance that test
        # credentials reach public logs (exposure audit EXP-02). Explicit test output can still leak.
        run: python -m pytest -q -rs -W error --tb=short
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
