[project]
name = "aao"
version = "0.1.0"
description = "Autonomous AI Organization — governed multi-project operating core"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.8,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
aao-migrate = "aao.migrator:main"
aao-ops = "aao.ops:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "nt(case_id): traceability marker for a negative test in AUTONOMOUS_GOVERNANCE_POLICY.md §16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
